name: Regenerate visual baselines

# Screenshot baselines are specific to the OS, fonts and browser build that
# rendered them. The committed baselines were rendered on macOS (*-darwin.png),
# so `toHaveScreenshot` cannot pass on Linux and the E2E tier has never run in
# CI. This workflow renders *-linux.png baselines on the GitHub-hosted runner
# image and uploads them as an artifact for a human to review and commit.
#
# It never runs automatically and never commits: a baseline that updates itself
# absorbs real regressions into the expected output. Run it when a screenshot
# test has no Linux baseline yet, or after an intentional UI change.
#
# The same run executes every Playwright test (the computed-style and layout
# invariants included) against the local Worker with seeded D1, so the job also
# fails if a non-visual E2E assertion fails; no baselines are uploaded then.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    name: Render Linux baselines
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # "chromium" uses Desktop Chrome; "mobile" uses the iPhone 13 device,
      # which runs on WebKit.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run E2E and write Linux baselines
        run: npx playwright test --update-snapshots=all

      - name: Upload Linux baselines
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines-linux
          path: tests/e2e/app.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
          retention-days: 14
