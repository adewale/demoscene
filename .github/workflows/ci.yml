name: CI

# Runs the same gate as `npm run test:fast` (format, lint, typecheck, unit and
# component tests, and the vitest-pool-workers integration suite against local
# workerd D1 and Queues). `npm run deploy` runs the same script first, so a red
# CI run and a blocked deploy mean the same thing.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-fast:
    name: test:fast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test:fast
        run: npm run test:fast
